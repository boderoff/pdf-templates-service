[project]
name = "pdf-generator-service"
version = "1.0.0"
description = "PDF Generator Service"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "xhtml2pdf>=0.2.15",
    "reportlab>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"